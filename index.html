<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G R A M And Associates LLP | Review</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Stars -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Welcome Screen -->
    <div id="welcome-screen" class="welcome-screen">
        <img src="image.png" alt="G R A M And Associates LLP Logo" class="welcome-logo">
        <h1 class="welcome-text">
            <span>Welcome to</span>
            <span class="brand-line">
                <span class="brand-main">G R A M And Associates</span>
                <span class="brand-suffix">LLP</span>
            </span>
        </h1>
    </div>

    <div class="container">
        <div class="card">
            <div class="header">
                <img src="image.png" alt="G R A M And Associates LLP Logo" class="logo">
                <p class="subtitle">
                    <span class="brand-main">G R A M And Associates</span>
                    <span class="brand-suffix">LLP</span>
                </p>
                <p class="address">Chartered Accountants • Tax & Financial Advisory</p>
            </div>

            <div class="rating-section">
                <h2>Rate your experience</h2>
                <div class="stars" id="star-rating">
                    <i class="fa-solid fa-star" data-value="1"></i>
                    <i class="fa-solid fa-star" data-value="2"></i>
                    <i class="fa-solid fa-star" data-value="3"></i>
                    <i class="fa-solid fa-star" data-value="4"></i>
                    <i class="fa-solid fa-star" data-value="5"></i>
                </div>
                <p id="rating-text">Select a rating</p>
            </div>

            <div class="message-section">
                <h2
                    style="margin-bottom: 0.5rem; text-align: left; font-size: 0.95rem; color: #A3A3A3; font-weight: 400;">
                    Suggested Prompts</h2>
                <div class="carousel-container" id="carousel-container">
                    <div class="carousel-card" id="carousel-card">
                        <textarea id="carousel-text" placeholder="Please select a star rating first"></textarea>
                    </div>
                    <div class="carousel-controls" id="carousel-controls" style="display: none;">
                        <button id="prev-btn" class="nav-btn"><i class="fa-solid fa-chevron-left"></i> Previous</button>
                        <div class="dots" id="carousel-dots"></div>
                        <button id="next-btn" class="nav-btn">Next <i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>

            <div class="action-section">
                <button id="submit-btn" class="primary-btn" disabled>
                    <span>Copy & Post to Google</span>
                    <i class="fa-brands fa-google"></i>
                </button>
                <p class="helper-text">Review copy ho jayega, bas Google review page par paste kar dein</p>
            </div>
        </div>
    </div>

    <!-- Copy Notification Toast (No Emojis, Mobile Optimized) -->
    <div id="copy-toast" class="copy-toast">
        <div class="toast-content">
            <i class="fa-solid fa-circle-check toast-icon"></i>
            <p class="toast-message">Review Copy Ho Gaya! Bas Google par jaakar Paste kar dein</p>
        </div>
    </div>

    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Canvas Confetti for party popper effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
